name: Build Justine Hub APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout JUSTINEHUB
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          rm -rf www
          mkdir -p www

          cp index.html www/
          cp app.js www/ || true
          cp style.css www/ || true
          cp manifest.json www/ || true
          cp justine-hub-logo.png www/ || true

          if [ -d "app" ]; then
            cp -r app www/app
          fi

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "justinehub",
            "version": "1.0.0",
            "private": true
          }
          EOF

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Create Android project
        run: |
          npx cap init "Justine Hub" "com.justinehub.app" --web-dir www
          npx cap add android

      - name: Fix Kotlin dependencies
        working-directory: android
        run: |
          cat >> build.gradle <<'EOF'

          allprojects {
              configurations.configureEach {
                  resolutionStrategy.eachDependency {
                      if (requested.group == "org.jetbrains.kotlin") {
                          if (requested.name == "kotlin-stdlib-jdk7" ||
                              requested.name == "kotlin-stdlib-jdk8" ||
                              requested.name == "kotlin-stdlib") {
                              useVersion("1.8.22")
                              because("Align Kotlin standard library versions")
                          }
                      }
                  }
              }
          }
          EOF

      - name: Force Kotlin stdlib alignment
        working-directory: android
        run: |
          cat >> gradle.properties <<'EOF'

          kotlin.stdlib.jdk.variants.version.alignment=true
          EOF

      - name: Sync web application
        run: |
          npx cap sync android

      - name: Show Kotlin dependencies
        working-directory: android
        run: |
          ./gradlew :app:dependencies \
            --configuration debugRuntimeClasspath \
            | grep -E "kotlin-stdlib" || true

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Verify APK
        run: |
          echo "Checking APK..."
          ls -lah android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Justine Hub APK
        uses: actions/upload-artifact@v4
        with:
          name: Justine-Hub-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
