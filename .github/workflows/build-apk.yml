name: Build Justine Hub APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout JUSTINEHUB
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project
        run: |
          mkdir -p www

          cp index.html www/ || true
          cp app.js www/ || true
          cp style.css www/ || true
          cp manifest.json www/ || true
          cp justine-hub-logo.png www/ || true

          if [ -d "app" ]; then
            cp -r app www/app
          fi

          cat > package.json <<'EOF'
          {
            "name": "justinehub",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "echo Justine Hub build"
            }
          }
          EOF

          npm install @capacitor/core @capacitor/cli @capacitor/android

          npx cap init "Justine Hub" "com.justinehub.app" --web-dir www

          npx cap add android

      - name: Sync Justine Hub into Android
        run: |
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Justine Hub APK
        uses: actions/upload-artifact@v4
        with:
          name: Justine-Hub-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
