name: Build Justine Hub APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout JUSTINEHUB
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          rm -rf www
          mkdir -p www

          cp index.html www/

          if [ -f app.js ]; then
            cp app.js www/
          fi

          if [ -f style.css ]; then
            cp style.css www/
          fi

          if [ -f manifest.json ]; then
            cp manifest.json www/
          fi

          if [ -f justine-hub-logo.png ]; then
            cp justine-hub-logo.png www/
          fi

          if [ -d app ]; then
            cp -r app www/app
          fi

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "justinehub",
            "version": "1.0.0",
            "private": true
          }
          EOF

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Create Android project
        run: |
          npx cap init "Justine Hub" "com.justinehub.app" --web-dir www
          npx cap add android

      - name: Sync web application
        run: |
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking APK..."

          if [ ! -f "$APK" ]; then
            echo "APK was not created."
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Justine-Hub-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: justine-hub-${{ github.run_number }}
          name: Justine Hub APK ${{ github.run_number }}
          generate_release_notes: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
