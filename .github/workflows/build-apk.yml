name: Build Justine Hub APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout JUSTINEHUB
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www

          cp index.html www/
          cp app.js www/ || true
          cp style.css www/ || true
          cp manifest.json www/ || true
          cp justine-hub-logo.png www/ || true

          if [ -d "app" ]; then
            cp -r app www/app
          fi

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "justinehub",
            "version": "1.0.0",
            "private": true
          }
          EOF

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Initialize Capacitor
        run: |
          npx cap init "Justine Hub" "com.justinehub.app" --web-dir www
          npx cap add android

      - name: Fix Kotlin dependency conflict
        working-directory: android
        run: |
          cat >> build.gradle <<'EOF'

          allprojects {
              configurations.all {
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
              }
          }
          EOF

      - name: Sync web app
        run: |
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Verify APK
        run: |
          ls -lah android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Justine Hub APK
        uses: actions/upload-artifact@v4
        with:
          name: Justine-Hub-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
