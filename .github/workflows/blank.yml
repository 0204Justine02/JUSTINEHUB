name: Build Justine Hub APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare website
        run: |
          rm -rf www
          mkdir -p www

          cp index.html www/

          [ -f app.js ] && cp app.js www/ || true
          [ -f style.css ] && cp style.css www/ || true
          [ -f manifest.json ] && cp manifest.json www/ || true
          [ -f justine-hub-logo.png ] && cp justine-hub-logo.png www/ || true

          if [ -d app ]; then
            cp -r app www/app
          fi

      - name: Create package
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Create Android project
        run: |
          npx cap init "JUSTINEHUB" "com.justinehub.app" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Set Android app name
        run: |
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">JUSTINEHUB<\/string>/' \
            android/app/src/main/res/values/strings.xml || true

      - name: Set app icon
        run: |
          if [ -f justine-hub-logo.png ]; then
            mkdir -p android/app/src/main/res/drawable
            cp justine-hub-logo.png android/app/src/main/res/drawable/justine_hub_logo.png
          fi

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk JUSTINEHUB.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: justinehub-latest
          name: JUSTINEHUB Latest
          body: |
            Latest JUSTINEHUB APK.

            Download JUSTINEHUB.apk below.
          files: JUSTINEHUB.apk
          make_latest: true
          prerelease: false
          overwrite_files: true
