name: Build Justine Hub APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare website
        run: |
          mkdir -p www
          cp index.html www/

          [ -f app.js ] && cp app.js www/ || true
          [ -f style.css ] && cp style.css www/ || true
          [ -f manifest.json ] && cp manifest.json www/ || true
          [ -f justine-hub-logo.png ] && cp justine-hub-logo.png www/ || true

          if [ -d app ]; then
            cp -r app www/app
          fi

      - name: Create package
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Create Android project
        run: |
          npx cap init "Justine Hub" "com.justinehub.app" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Justine-Hub-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
