
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10101a">
<title>Justine Hub</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    color: white;
    background:
        radial-gradient(circle at top left, #553c9a, transparent 40%),
        radial-gradient(circle at bottom right, #0ea5e9, transparent 40%),
        #09090f;
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

/* LOCK SCREEN */
#lockScreen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background:
        linear-gradient(135deg, #09090f, #21134d, #071b30);
}

.lockBox {
    width: 100%;
    max-width: 360px;
    padding: 30px 25px;
    text-align: center;
    border-radius: 25px;
    background: rgba(255,255,255,.10);
    border: 1px solid rgba(255,255,255,.18);
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
}

.lockBox h1 {
    font-size: 28px;
    margin-bottom: 10px;
}

.lockBox p {
    color: #bbb;
    margin-bottom: 20px;
}

#passwordInput {
    width: 100%;
    padding: 15px;
    border: 0;
    outline: 0;
    border-radius: 14px;
    font-size: 18px;
    text-align: center;
    margin-bottom: 12px;
}

#unlockBtn {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 14px;
    background: #7c3aed;
    color: white;
    font-size: 17px;
    font-weight: bold;
}

#error {
    color: #ff6b81;
    margin-top: 12px;
    min-height: 20px;
}

/* APP */
#app {
    display: none;
    min-height: 100vh;
    padding-bottom: 40px;
}

header {
    padding: 25px 18px 15px;
    text-align: center;
}

header h1 {
    font-size: 30px;
}

header p {
    color: #aaa;
    margin-top: 5px;
}

.container {
    width: 94%;
    max-width: 600px;
    margin: auto;
}

.card {
    margin: 15px 0;
    padding: 20px;
    border-radius: 22px;
    background: rgba(255,255,255,.10);
    border: 1px solid rgba(255,255,255,.15);
    backdrop-filter: blur(18px);
    box-shadow: 0 10px 35px rgba(0,0,0,.25);
}

.card h2 {
    margin-bottom: 15px;
    font-size: 20px;
}

/* MUSIC */
#songTitle {
    color: #ddd;
    margin-bottom: 15px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.musicButtons {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 15px 0;
}

button {
    border: 0;
    border-radius: 13px;
    padding: 12px 16px;
    background: #7c3aed;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(.96);
}

.bigPlay {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    font-size: 22px;
}

input[type="range"] {
    width: 100%;
}

#playlist {
    margin-top: 15px;
}

.song {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px;
    margin-top: 8px;
    border-radius: 12px;
    background: rgba(0,0,0,.2);
}

.songName {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* LINKS */
.linkRow {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
}

.linkRow input {
    min-width: 0;
    flex: 1;
    padding: 12px;
    border: 0;
    border-radius: 10px;
}

.linkList a {
    display: block;
    color: white;
    text-decoration: none;
    padding: 13px;
    margin-top: 8px;
    border-radius: 12px;
    background: rgba(0,0,0,.22);
}

/* NOTES */
textarea {
    width: 100%;
    min-height: 150px;
    resize: vertical;
    border: 0;
    outline: 0;
    border-radius: 14px;
    padding: 15px;
    font-size: 16px;
}

/* BACKGROUND */
.fileButton {
    display: block;
    text-align: center;
    padding: 14px;
    border-radius: 13px;
    background: #7c3aed;
    font-weight: bold;
    cursor: pointer;
}

input[type="file"] {
    display: none;
}

.clearBg {
    margin-top: 10px;
    background: #333;
}

/* MOBILE */
@media(max-width: 400px) {
    header h1 {
        font-size: 26px;
    }

    .card {
        padding: 16px;
    }

    button {
        padding: 11px 13px;
    }
}
</style>
</head>

<body>

<!-- ========================= -->
<!-- PASSWORD SCREEN -->
<!-- ========================= -->

<div id="lockScreen">

    <div class="lockBox">

        <h1>🔐 Justine Hub</h1>

        <p>Enter your password</p>

        <input
            id="passwordInput"
            type="password"
            inputmode="numeric"
            placeholder="Password"
            autocomplete="off"
        >

        <button id="unlockBtn">
            🔓 Unlock
        </button>

        <div id="error"></div>

    </div>

</div>


<!-- ========================= -->
<!-- MAIN APP -->
<!-- ========================= -->

<div id="app">

<header>
    <h1>🎵 Justine Hub</h1>
    <p>Your personal mobile hub</p>
</header>


<div class="container">


<!-- MUSIC PLAYER -->

<div class="card">

    <h2>🎵 Music Player</h2>

    <input
        type="file"
        id="musicInput"
        accept="audio/*"
        multiple
    >

    <label for="musicInput" class="fileButton">
        ➕ Add Music From Phone
    </label>

    <br>

    <div id="songTitle">
        No song selected
    </div>

    <audio id="audio"></audio>

    <input
        type="range"
        id="progress"
        min="0"
        max="100"
        value="0"
    >

    <div class="musicButtons">

        <button onclick="previousSong()">
            ⏮
        </button>

        <button
            class="bigPlay"
            id="playBtn"
            onclick="togglePlay()"
        >
            ▶
        </button>

        <button onclick="nextSong()">
            ⏭
        </button>

    </div>

    <label>🔊 Volume</label>

    <input
        type="range"
        id="volume"
        min="0"
        max="100"
        value="100"
    >

    <div id="playlist"></div>

</div>


<!-- LINKS -->

<div class="card">

    <h2>🔗 My Links</h2>

    <div class="linkRow">

        <input
            id="linkName"
            placeholder="Name"
        >

        <input
            id="linkURL"
            placeholder="https://..."
        >

    </div>

    <button onclick="addLink()">
        ➕ Add Link
    </button>

    <div
        id="linkList"
        class="linkList"
    ></div>

</div>


<!-- NOTES -->

<div class="card">

    <h2>📝 Notes</h2>

    <textarea
        id="notes"
        placeholder="Write your notes here..."
    ></textarea>

    <br><br>

    <button onclick="saveNotes()">
        💾 Save Notes
    </button>

</div>


<!-- BACKGROUND -->

<div class="card">

    <h2>🖼 Custom Background</h2>

    <input
        type="file"
        id="backgroundInput"
        accept="image/*"
    >

    <label
        for="backgroundInput"
        class="fileButton"
    >
        📱 Choose Background
    </label>

    <button
        class="clearBg"
        onclick="clearBackground()"
    >
        Reset Background
    </button>

</div>


<!-- LOCK -->

<div class="card">

    <h2>🔒 Security</h2>

    <button onclick="lockHub()">
        🔐 Lock Hub
    </button>

</div>


</div>
</div>


<script>

/* ==================================
   PASSWORD
================================== */

const PASSWORD = "0204";

const lockScreen =
    document.getElementById("lockScreen");

const app =
    document.getElementById("app");

const passwordInput =
    document.getElementById("passwordInput");

const unlockBtn =
    document.getElementById("unlockBtn");

const error =
    document.getElementById("error");


function unlock() {

    if (passwordInput.value === PASSWORD) {

        lockScreen.style.display = "none";

        app.style.display = "block";

        error.textContent = "";

        passwordInput.value = "";

    } else {

        error.textContent =
            "❌ Incorrect password";

        passwordInput.value = "";

        passwordInput.focus();

    }

}


unlockBtn.addEventListener(
    "click",
    unlock
);


passwordInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            unlock();
        }

    }
);


/* ==================================
   LOCK HUB
================================== */

function lockHub() {

    app.style.display = "none";

    lockScreen.style.display = "flex";

    passwordInput.value = "";

    passwordInput.focus();

}


/* ==================================
   MUSIC PLAYER
================================== */

const audio =
    document.getElementById("audio");

const musicInput =
    document.getElementById("musicInput");

const playlist =
    document.getElementById("playlist");

const songTitle =
    document.getElementById("songTitle");

const progress =
    document.getElementById("progress");

const volume =
    document.getElementById("volume");

const playBtn =
    document.getElementById("playBtn");


let songs = [];

let currentSong = 0;


/* ADD MUSIC */

musicInput.addEventListener(
    "change",
    function() {

        const files =
            Array.from(this.files);

        songs.push(...files);

        displayPlaylist();

        if (
            songs.length === files.length &&
            songs.length > 0
        ) {
            playSong(0);
        }

    }
);


/* PLAY SONG */

function playSong(index) {

    if (!songs[index]) return;

    currentSong = index;

    const file =
        songs[index];

    audio.src =
        URL.createObjectURL(file);

    songTitle.textContent =
        file.name;

    audio.play();

    playBtn.textContent = "⏸";

}


/* PLAY / PAUSE */

function togglePlay() {

    if (!audio.src) return;

    if (audio.paused) {

        audio.play();

        playBtn.textContent = "⏸";

    } else {

        audio.pause();

        playBtn.textContent = "▶";

    }

}


/* NEXT */

function nextSong() {

    if (!songs.length) return;

    currentSong++;

    if (
        currentSong >= songs.length
    ) {
        currentSong = 0;
    }

    playSong(currentSong);

}


/* PREVIOUS */

function previousSong() {

    if (!songs.length) return;

    currentSong--;

    if (currentSong < 0) {
        currentSong = songs.length - 1;
    }

    playSong(currentSong);

}


/* AUTO NEXT */

audio.addEventListener(
    "ended",
    nextSong
);


/* PROGRESS */

audio.addEventListener(
    "timeupdate",
    function() {

        if (!audio.duration) return;

        progress.value =
            (audio.currentTime /
            audio.duration) * 100;

    }
);


progress.addEventListener(
    "input",
    function() {

        if (!audio.duration) return;

        audio.currentTime =
            (progress.value / 100)
            * audio.duration;

    }
);


/* VOLUME */

volume.addEventListener(
    "input",
    function() {

        audio.volume =
            volume.value / 100;

    }
);


/* PLAYLIST */

function displayPlaylist() {

    playlist.innerHTML = "";

    songs.forEach(
        function(song, index) {

            const row =
                document.createElement("div");

            row.className = "song";

            const name =
                document.createElement("div");

            name.className = "songName";

            name.textContent =
                "🎵 " + song.name;

            const button =
                document.createElement("button");

            button.textContent = "▶";

            button.onclick =
                function() {
                    playSong(index);
                };

            row.appendChild(name);

            row.appendChild(button);

            playlist.appendChild(row);

        }
    );

}


/* ==================================
   LINKS
================================== */

let links =
    JSON.parse(
        localStorage.getItem(
            "justineLinks"
        ) || "[]"
    );


function addLink() {

    const name =
        document.getElementById(
            "linkName"
        ).value.trim();

    const url =
        document.getElementById(
            "linkURL"
        ).value.trim();

    if (!name || !url) {

        alert(
            "Enter a name and link."
        );

        return;

    }

    let finalURL = url;

    if (
        !finalURL.startsWith("http://") &&
        !finalURL.startsWith("https://")
    ) {

        finalURL =
            "https://" + finalURL;

    }

    links.push({
        name: name,
        url: finalURL
    });

    localStorage.setItem(
        "justineLinks",
        JSON.stringify(links)
    );

    document.getElementById(
        "linkName"
    ).value = "";

    document.getElementById(
        "linkURL"
    ).value = "";

    displayLinks();

}


function displayLinks() {

    const list =
        document.getElementById(
            "linkList"
        );

    list.innerHTML = "";

    links.forEach(
        function(link, index) {

            const box =
                document.createElement("div");

            const a =
                document.createElement("a");

            a.href = link.url;

            a.target = "_blank";

            a.textContent =
                "🔗 " + link.name;

            const deleteButton =
                document.createElement("button");

            deleteButton.textContent =
                "🗑";

            deleteButton.style.marginTop =
                "5px";

            deleteButton.onclick =
                function() {

                    links.splice(index, 1);

                    localStorage.setItem(
                        "justineLinks",
                        JSON.stringify(links)
                    );

                    displayLinks();

                };

            box.appendChild(a);

            box.appendChild(deleteButton);

            list.appendChild(box);

        }
    );

}


displayLinks();


/* ==================================
   NOTES
================================== */

const notes =
    document.getElementById(
        "notes"
    );


const savedNotes =
    localStorage.getItem(
        "justineNotes"
    );


if (savedNotes) {

    notes.value =
        savedNotes;

}


function saveNotes() {

    localStorage.setItem(
        "justineNotes",
        notes.value
    );

    alert(
        "✅ Notes saved!"
    );

}


/* ==================================
   BACKGROUND
================================== */

const backgroundInput =
    document.getElementById(
        "backgroundInput"
    );


const savedBackground =
    localStorage.getItem(
        "justineBackground"
    );


if (savedBackground) {

    document.body.style.backgroundImage =
        "url(" + savedBackground + ")";

}


backgroundInput.addEventListener(
    "change",
    function() {

        const file =
            this.files[0];

        if (!file) return;

        const reader =
            new FileReader();

        reader.onload =
            function(event) {

                const image =
                    event.target.result;

                document.body.style.backgroundImage =
                    "url(" + image + ")";

                localStorage.setItem(
                    "justineBackground",
                    image
                );

            };

        reader.readAsDataURL(file);

    }
);


function clearBackground() {

    localStorage.removeItem(
        "justineBackground"
    );

    document.body.style.backgroundImage =
        "";

}


/* ==================================
   START
================================== */

audio.volume = 1;

console.log(
    "Justine Hub is ready!"
);

</script>

</body>
</html>
